<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Cartoon Manusia 3D — Cowo & Cewe</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a24; font-family: system-ui, -apple-system, sans-serif; }
  canvas { display: block; }
  
  #hud {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    color: #fff; pointer-events: none; user-select: none;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }
  #hud h1 { font-size: 18px; font-weight: 800; letter-spacing: 1px; color: #ffd166; }
  #hud p { font-size: 12px; color: #a0a0b0; margin-top: 4px; line-height: 1.5; }
  
  /* Lil-gui custom style */
  .lil-gui { --width: 300px; }
</style>
</head>
<body>

<div id="hud">
  <h1>CARTOON STUDIO</h1>
  <p>Drag kiri: Rotasi · Scroll: Zoom · Drag kanan: Geser<br>Semua 17 sendi bisa diputar manual!</p>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import GUI from 'three/addons/libs/lil-gui.module.min.js';

/* =========================================================
   1. SCENE, CAMERA, RENDERER, LIGHTS
   ========================================================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a24);
scene.fog = new THREE.Fog(0x1a1a24, 12, 30);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 2.5, 7);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 15;
controls.maxPolarAngle = Math.PI * 0.55;

// Lights
scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 1.2));

const keyLight = new THREE.DirectionalLight(0xfff4e6, 2.5);
keyLight.position.set(5, 8, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -6;
keyLight.shadow.camera.right = 6;
keyLight.shadow.camera.top = 6;
keyLight.shadow.camera.bottom = -6;
keyLight.shadow.bias = -0.001;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x7fb8ff, 1.5);
fillLight.position.set(-5, 3, -5);
scene.add(fillLight);

// Ground
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(10, 64),
  new THREE.MeshStandardMaterial({ color: 0x2a2a35, roughness: 0.8, metalness: 0.1 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const grid = new THREE.GridHelper(20, 40, 0x3a3a45, 0x2a2a35);
grid.position.y = 0.002;
scene.add(grid);

/* =========================================================
   2. MATERIALS & HELPERS
   ========================================================= */
const MAT = {
  skin: new THREE.MeshStandardMaterial({ color: 0xfcdbb4, roughness: 0.6 }),
  skinDark: new THREE.MeshStandardMaterial({ color: 0xe0b88c, roughness: 0.6 }),
  eyeWhite: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 }),
  eyeBlack: new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 }),
  mouth: new THREE.MeshStandardMaterial({ color: 0xd65d5d, roughness: 0.5 }),
  
  // Pakaian Cowo
  mShirt: new THREE.MeshStandardMaterial({ color: 0x4a90e2, roughness: 0.7 }),
  mPants: new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.8 }),
  mShoe: new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.9 }),
  mHair: new THREE.MeshStandardMaterial({ color: 0x4a3320, roughness: 0.8 }),
  
  // Pakaian Cewe
  fShirt: new THREE.MeshStandardMaterial({ color: 0xff6b8b, roughness: 0.7 }),
  fSkirt: new THREE.MeshStandardMaterial({ color: 0x9b59b6, roughness: 0.8 }),
  fShoe: new THREE.MeshStandardMaterial({ color: 0xe74c3c, roughness: 0.9 }),
  fHair: new THREE.MeshStandardMaterial({ color: 0xf1c40f, roughness: 0.8 }),

  // Joint balls (untuk indikator sendi)
  joint: new THREE.MeshStandardMaterial({ color: 0xffd166, roughness: 0.3, metalness: 0.5, transparent: true, opacity: 0.6 })
};

// Helper: Membuat sendi (pivot)
function joint(parent, pos, name, showBall = false) {
  const o = new THREE.Object3D();
  o.position.set(pos[0], pos[1], pos[2]);
  parent.add(o);
  
  if (showBall) {
    const ball = new THREE.Mesh(new THREE.SphereGeometry(0.03, 8, 8), MAT.joint);
    o.add(ball);
  }
  return o;
}

// Helper: Membuat mesh anggota badan
function limbMesh(geoType, params, mat, yOffset = 0) {
  let geo;
  if (geoType === 'capsule') geo = new THREE.CapsuleGeometry(params[0], params[1], 8, 16);
  if (geoType === 'sphere') geo = new THREE.SphereGeometry(params[0], 16, 16);
  if (geoType === 'box') geo = new THREE.BoxGeometry(params[0], params[1], params[2]);
  if (geoType === 'cylinder') geo = new THREE.CylinderGeometry(params[0], params[1], params[2], 16);
  
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.y = yOffset;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

/* =========================================================
   3. KARAKTER FACTORY (Cowok & Cewe)
   ========================================================= */
const CHARACTERS = { male: {}, female: {} };

function createCharacter(isMale, offsetX) {
  const root = new THREE.Group();
  root.position.x = offsetX;
  scene.add(root);

  const J = {}; // Object3D untuk sendi
  const P = {}; // Rotasi (Euler)

  function addJoint(name, parent, pos) {
    J[name] = joint(parent, pos, name);
    P[name] = { x: 0, y: 0, z: 0 };
    return J[name];
  }

  // Warna & Material
  const cSkin = isMale ? MAT.skin : MAT.skin;
  const cShirt = isMale ? MAT.mShirt : MAT.fShirt;
  const cPants = isMale ? MAT.mPants : MAT.fSkirt;
  const cShoe = isMale ? MAT.mShoe : MAT.fShoe;
  const cHair = isMale ? MAT.mHair : MAT.fHair;

  // --- TORSO & KEPALA ---
  const pelvis = addJoint('pelvis', root, [0, 0.9, 0]);
  const pelvisMesh = limbMesh('box', [0.32, 0.15, 0.2], cShirt, 0);
  pelvisMesh.position.y = 0.02;
  pelvis.add(pelvisMesh);

  const spine = addJoint('spine', pelvis, [0, 0.1, 0]);
  const spineMesh = limbMesh('capsule', [0.13, 0.3], cShirt, 0.15);
  spine.add(spineMesh);

  const chest = addJoint('chest', spine, [0, 0.3, 0]);
  const chestMesh = limbMesh('capsule', [0.16, 0.15], cShirt, 0.1);
  if (isMale) chestMesh.scale.set(1.1, 1, 0.9); // Dada cowo lebih bidang
  else chestMesh.scale.set(0.95, 1, 0.95);
  chest.add(chestMesh);

  const neck = addJoint('neck', chest, [0, 0.15, 0]);
  const neckMesh = limbMesh('cylinder', [0.045, 0.045, 0.08], cSkin, 0.04);
  neck.add(neckMesh);

  const head = addJoint('head', neck, [0, 0.08, 0]);
  const headMesh = limbMesh('sphere', [0.18], cSkin, 0.15);
  if (!isMale) headMesh.scale.set(0.95, 1.05, 0.95);
  head.add(headMesh);

  // --- RAMBUT ---
  if (isMale) {
    const hair = limbMesh('sphere', [0.185], cHair, 0.17);
    hair.scale.set(1, 0.8, 1);
    hair.position.z = -0.02;
    head.add(hair);
  } else {
    // Rambut Cewe: Belakang + Poni + Ekor Kuda
    const hairBack = limbMesh('capsule', [0.17, 0.25], cHair, 0.1);
    hairBack.position.z = -0.05;
    hairBack.scale.set(1.05, 1, 0.8);
    head.add(hairBack);
    
    const hairFringe = limbMesh('sphere', [0.19], cHair, 0.22);
    hairFringe.scale.set(1, 0.6, 1);
    hairFringe.position.z = -0.02;
    head.add(hairFringe);
    
    // Ekor kuda
    const ponytail = limbMesh('capsule', [0.06, 0.25], cHair, 0);
    ponytail.position.set(0, 0.05, -0.18);
    ponytail.rotation.x = -0.4;
    head.add(ponytail);
  }

  // --- WAJAH (Mata, Hidung, Mulut) ---
  const faceGroup = new THREE.Group();
  faceGroup.position.set(0, 0.16, 0.16); // Depan kepala
  head.add(faceGroup);

  // Mata (Kiri & Kanan)
  [-1, 1].forEach(s => {
    const eyeGroup = new THREE.Group();
    eyeGroup.position.set(0.06 * s, 0, 0);
    faceGroup.add(eyeGroup);
    
    const white = limbMesh('sphere', [0.035], MAT.eyeWhite);
    white.scale.set(0.8, 1.2, 0.5);
    eyeGroup.add(white);
    
    const pupil = limbMesh('sphere', [0.015], MAT.eyeBlack);
    pupil.position.set(0, -0.005, 0.03);
    eyeGroup.add(pupil);
    
    const shine = limbMesh('sphere', [0.006], MAT.eyeWhite);
    shine.position.set(0.005, 0.01, 0.04);
    eyeGroup.add(shine);
  });

  // Hidung
  const nose = limbMesh('sphere', [0.015], MAT.skinDark);
  nose.position.set(0, -0.03, 0.05);
  faceGroup.add(nose);

  // Mulut (Senyum)
  const mouth = limbMesh('box', [0.05, 0.01, 0.01], MAT.mouth);
  mouth.position.set(0, -0.06, 0.04);
  faceGroup.add(mouth);

  // --- LENGAN ---
  ['L', 'R'].forEach(side => {
    const s = side === 'L' ? 1 : -1;
    const shoulderX = isMale ? 0.25 : 0.22;
    
    const shoulder = addJoint('shoulder' + side, chest, [shoulderX * s, 0.12, 0]);
    
    // Lengan atas
    const upperArm = limbMesh('capsule', [0.05, 0.2], cShirt, -0.1);
    shoulder.add(upperArm);

    const elbow = addJoint('elbow' + side, shoulder, [0, -0.22, 0]);
    
    // Lengan bawah (Kulit)
    const lowerArm = limbMesh('capsule', [0.04, 0.2], cSkin, -0.1);
    elbow.add(lowerArm);

    const wrist = addJoint('wrist' + side, elbow, [0, -0.22, 0]);
    
    // Tangan
    const hand = limbMesh('sphere', [0.05], cSkin);
    hand.scale.set(0.8, 1, 0.8);
    hand.position.y = -0.04;
    wrist.add(hand);
  });

  // --- TUNGKAI / KAKI ---
  ['L', 'R'].forEach(side => {
    const s = side === 'L' ? 1 : -1;
    const hipX = isMale ? 0.1 : 0.09;
    
    const hip = addJoint('hip' + side, pelvis, [hipX * s, -0.05, 0]);
    
    // Paha
    const upperLeg = limbMesh('capsule', [0.06, 0.25], cSkin, -0.125);
    if (!isMale) {
        // Cewe pakai rok
        upperLeg.material = cSkin; 
    } else {
        upperLeg.material = cPants;
    }
    hip.add(upperLeg);

    // Rok Cewe (ditempel di pelvis, bukan di paha)
    if (!isMale && side === 'L') {
        const skirt = limbMesh('cylinder', [0.18, 0.35, 0.25], cPants, -0.15);
        pelvis.add(skirt);
    }

    const knee = addJoint('knee' + side, hip, [0, -0.3, 0]);
    
    // Betis
    const lowerLeg = limbMesh('capsule', [0.05, 0.25], isMale ? cPants : cSkin, -0.125);
    knee.add(lowerLeg);

    const ankle = addJoint('ankle' + side, knee, [0, -0.3, 0]);
    
    // Sepatu
    const shoe = limbMesh('box', [0.1, 0.08, 0.2], cShoe);
    shoe.position.set(0, -0.04, 0.05);
    ankle.add(shoe);
  });

  // Simpan referensi
  CHARACTERS[isMale ? 'male' : 'female'] = { J, P, root };
}

// Buat kedua karakter (Cowok di kiri, Cewe di kanan)
createCharacter(true, -1.1);
createCharacter(false, 1.1);

/* =========================================================
   4. ANIMASI (Menggerakkan kedua karakter bersamaan)
   ========================================================= */
function zeroPose(P) {
  for (const k in P) { P[k].x = 0; P[k].y = 0; P[k].z = 0; }
}

const anims = {
  idle(t, P, root) {
    const s = Math.sin(t * 2);
    P.spine.x = 0.02 + 0.01 * s;
    P.chest.x = -0.02 * s;
    P.head.y = 0.1 * Math.sin(t * 0.5);
    
    // Tangan bergoyang pelan
    P.shoulderL.z = 0.15 + 0.02 * s;
    P.shoulderR.z = -(0.15 + 0.02 * s);
    P.elbowL.x = -0.2 - 0.05 * s;
    P.elbowR.x = -0.2 - 0.05 * s;
    
    root.position.y = 0.01 * s;
  },
  
  walk(t, P, root) {
    const w = t * 4, A = 0.6;
    P.hipL.x = A * Math.sin(w);
    P.hipR.x = A * Math.sin(w + Math.PI);
    P.kneeL.x = 0.2 + 1.0 * Math.max(0, Math.sin(w - 1.2));
    P.kneeR.x = 0.2 + 1.0 * Math.max(0, Math.sin(w + Math.PI - 1.2));
    
    P.shoulderL.x = -0.5 * Math.sin(w);
    P.shoulderR.x = -0.5 * Math.sin(w + Math.PI);
    P.shoulderL.z = 0.1;
    P.shoulderR.z = -0.1;
    P.elbowL.x = -0.4;
    P.elbowR.x = -0.4;
    
    root.position.y = Math.abs(Math.sin(w)) * 0.04;
  },
  
  run(t, P, root) {
    const w = t * 6, A = 0.9;
    P.hipL.x = A * Math.sin(w) - 0.2;
    P.hipR.x = A * Math.sin(w + Math.PI) - 0.2;
    P.kneeL.x = 0.3 + 1.4 * Math.max(0, Math.sin(w - 0.8));
    P.kneeR.x = 0.3 + 1.4 * Math.max(0, Math.sin(w + Math.PI - 0.8));
    
    P.shoulderL.x = -0.9 * Math.sin(w);
    P.shoulderR.x = -0.9 * Math.sin(w + Math.PI);
    P.elbowL.x = -1.2;
    P.elbowR.x = -1.2;
    
    P.spine.x = 0.3;
    root.position.y = Math.abs(Math.sin(w)) * 0.08;
  },
  
  wave(t, P, root) {
    P.shoulderR.z = -2.2;
    P.shoulderR.x = -0.2;
    P.elbowR.x = -0.5;
    P.elbowR.z = 0.5 * Math.sin(t * 10);
    
    P.head.y = 0.2;
    P.head.z = -0.05;
    root.position.y = 0.01 * Math.sin(t * 4);
  },
  
  dance(t, P, root) {
    const w = t * 4;
    P.spine.y = 0.4 * Math.sin(w * 0.5);
    P.chest.y = 0.3 * Math.sin(w * 0.5 + 1);
    P.head.y = 0.4 * Math.sin(w * 0.5 + 2);
    
    // Tangan joget
    P.shoulderL.z = 1.2 + 0.6 * Math.sin(w);
    P.shoulderR.z = -(1.2 + 0.6 * Math.sin(w + 1));
    P.elbowL.x = -1.2;
    P.elbowR.x = -1.2;
    
    // Kaki joget
    P.hipL.x = 0.4 * Math.sin(w);
    P.hipR.x = 0.4 * Math.sin(w + Math.PI);
    P.kneeL.x = 0.3 + 0.3 * Math.sin(w);
    P.kneeR.x = 0.3 + 0.3 * Math.sin(w + Math.PI);
    
    root.position.y = 0.05 * Math.abs(Math.sin(w));
    root.rotation.y = 0.2 * Math.sin(w * 0.5);
  }
};

/* =========================================================
   5. GUI CONTROL
   ========================================================= */
const state = {
  anim: 'idle',
  playing: true,
  speed: 1.0,
  activeChar: 'male', // 'male' atau 'female'
  showJoints: true
};

let animTime = 0;
let playCtrl = null;
const guiCtrls = [];

const gui = new GUI({ title: '🎮 Kontrol Animasi' });

gui.add(state, 'anim', Object.keys(anims)).name('Preset Animasi').onChange(() => {
  animTime = 0;
  state.playing = true;
  if (playCtrl) playCtrl.updateDisplay();
});

playCtrl = gui.add(state, 'playing').name('▶ Mainkan Animasi');
gui.add(state, 'speed', 0.1, 3.0, 0.05).name('Kecepatan');

gui.add(state, 'showJoints').name('Tampilkan Sendi').onChange(val => {
  scene.traverse(child => {
    if (child.material === MAT.joint) child.visible = val;
  });
});

// Ganti Karakter yang dikontrol GUI
const charFolder = gui.addFolder('🕹️ Kontrol Sendi Manual');
charFolder.add(state, 'activeChar', ['male', 'female']).name('Pilih Karakter').onChange(() => buildJointGUI());
charFolder.open();

const jointFolder = charFolder.addFolder('Rotasi Sendi');
jointFolder.open();

let jointControllers = [];

function buildJointGUI() {
  // Hapus controller lama
  jointControllers.forEach(c => c.destroy());
  jointControllers = [];
  
  const char = CHARACTERS[state.activeChar];
  const P = char.P;

  const labels = {
    pelvis: 'Pinggul', spine: 'Punggung', chest: 'Dada', neck: 'Leher', head: 'Kepala',
    shoulderL: 'Bahu Kiri', elbowL: 'Siku Kiri', wristL: 'Tangan Kiri',
    shoulderR: 'Bahu Kanan', elbowR: 'Siku Kanan', wristR: 'Tangan Kanan',
    hipL: 'Pinggul Kiri', kneeL: 'Lutut Kiri', ankleL: 'Kaki Kiri',
    hipR: 'Pinggul Kanan', kneeR: 'Lutut Kanan', ankleR: 'Kaki Kanan'
  };

  for (const key in P) {
    const f = jointFolder.addFolder(labels[key] || key);
    const onCh = () => { state.playing = false; if(playCtrl) playCtrl.updateDisplay(); };
    
    jointControllers.push(f.add(P[key], 'x', -Math.PI, Math.PI, 0.01).name('X').onChange(onCh));
    jointControllers.push(f.add(P[key], 'y', -Math.PI, Math.PI, 0.01).name('Y').onChange(onCh));
    jointControllers.push(f.add(P[key], 'z', -Math.PI, Math.PI, 0.01).name('Z').onChange(onCh));
    f.close();
  }
}

// Bangun GUI pertama kali
buildJointGUI();

/* =========================================================
   6. RENDER LOOP
   ========================================================= */
const clock = new THREE.Clock();
let frameCount = 0;

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);

  if (state.playing) {
    animTime += dt * state.speed;

    // Terapkan animasi ke kedua karakter
    ['male', 'female'].forEach(type => {
      const char = CHARACTERS[type];
      zeroPose(char.P);
      char.root.position.set(type === 'male' ? -1.1 : 1.1, 0, 0);
      char.root.rotation.set(0, 0, 0);
      
      // Beri sedikit delay pada karakter cewe agar tidak kaku
      const t = animTime + (type === 'female' ? 0.5 : 0);
      (anims[state.anim] || anims.idle)(t, char.P, char.root);
    });

    // Update GUI secara berkala
    if (++frameCount % 5 === 0) {
      jointControllers.forEach(c => c.updateDisplay());
    }
  }

  // Terapkan rotasi ke 3D Object
  ['male', 'female'].forEach(type => {
    const char = CHARACTERS[type];
    for (const k in char.J) {
      char.J[k].rotation.set(char.P[k].x, char.P[k].y, char.P[k].z);
    }
  });

  controls.update();
  renderer.render(scene, camera);
}

/* =========================================================
   7. RESIZE
   ========================================================= */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
